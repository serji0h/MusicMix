<ion-header>
  <ion-toolbar>
    <ion-title>Iniciar Sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-label position="floating">Email</ion-label>
  <ion-item>
    <ion-input type="email" [(ngModel)]="email" name="email"></ion-input>
  </ion-item>
  <ion-label position="floating">Contraseña</ion-label>
  <ion-item>

    <ion-input type="password" [(ngModel)]="contrasena" name="contrasena"></ion-input>
  </ion-item>

  <ion-button expand="full" id="iniciarSesion" (click)="easyLogin()">Iniciar Sesión</ion-button>
  <ion-toast trigger="iniciarSesion" [message]="mensaje" duration="2000"></ion-toast>
</ion-content>
