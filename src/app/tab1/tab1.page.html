<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Canciones</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-searchbar placeholder="Buscar canciones" (ionInput)="searchSongs($event)"></ion-searchbar>

  <!-- Input para seleccionar directorio en web -->
  <div *ngIf="!isMobile" class="file-input">
    <input type="file" (change)="directorySelected($event)" webkitdirectory directory multiple />
  </div>

  <ion-list>
    <ion-item *ngFor="let song of songsSearched" lines="none">
      <div class="container-song">
        <div class="playable-btn" (click)="openPlayer(song)">
          <ion-thumbnail>
            <img src="assets/cover/image.png" alt="Song Cover" />
          </ion-thumbnail>
          <ion-label>
            <h6>{{ song.title || song.nombre }}</h6>
          </ion-label>
        </div>
        <div class="add-to-playlist">
          <button (click)="presentActionSheet(song); $event.stopPropagation()">
            <ion-icon name="add-circle-outline"></ion-icon>
          </button>
        </div>
      </div>
    </ion-item>
  </ion-list>
</ion-content>
